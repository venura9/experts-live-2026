# AI peer review on a MICROSOFT-HOSTED agent.
#
# Companion to azure-pipelines.yml, which runs on a self-hosted agent.
# Same review, same model, different trust argument:
#
#   self-hosted  ->  "our code never leaves our network"
#   hosted       ->  "we add no new vendor to our supply chain"
#
# The second claim is the one most enterprises actually need. If your repo is
# already in Azure DevOps, Microsoft is already a processor for that code and it
# is already running in their cloud. Loading a model in-process on the same
# agent expands the trust boundary by zero. Calling a third-party AI API from
# the same pipeline does not: that is a new vendor, a new DPA, a new egress
# rule, and in a regulated shop, months of process.
#
# ---------------------------------------------------------------------------
# HOSTED AGENT LIMITS (verified against Microsoft Learn, July 2026)
# ---------------------------------------------------------------------------
#   CPU            2 cores (Standard_DS2_v2). No GPU, no NPU. CPU EP only.
#   RAM            7 GB total; Linux jobs run in a cgroup with 6 GB physical
#   Disk           14 GB SSD, at least 10 GB free for your job
#   Job timeout    60 min on a PRIVATE repo (free tier)
#                  360 min on a public repo, or private with paid parallel jobs
#   Lifetime       fresh VM per job, discarded afterwards
#
# Three consequences that shape this file:
#
#   1. The model re-downloads on every run unless you cache it. That is what the
#      Cache@2 task below is for. Without it you burn several minutes and a
#      chunk of your 60 on a download you already did yesterday.
#   2. Pick a SMALL model. On 2 CPU cores a 3.8B model reviewing several files
#      will eat your timeout. qwen2.5-0.5b is the safe default here; move up
#      only after you have measured it.
#   3. Keep the review scope tight. Path filters are not a nicety on a hosted
#      agent, they are what keeps you inside the timeout.
#
# LAYOUT ASSUMPTION (same as azure-pipelines.yml)
#   This runs from the root of the repo holding the MuleSoft app. Copy the
#   review tooling in beside it:
#
#     order-api/
#       src/main/mule/...          <- from seed_flaws.py
#       pom.xml
#       scripts/ai_review.py
#       scripts/ai_review_sdk.py
#       prompts/mulesoft-review.md
#       review-paths.txt
#       hosted-requirements.txt
#       azure-pipelines.yml
#       azure-pipelines-hosted.yml
#
#   Azure DevOps checks out one repo per pipeline, so the reviewer has to live
#   with the code it reviews.
# ---------------------------------------------------------------------------

trigger: none

# Azure Repos does not honour a `pr:` trigger. Wire this as a BUILD VALIDATION
# policy on the target branch instead. Same trap as the self-hosted pipeline.
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Small on purpose. See consequence 2 above.
  #
  # This MUST be FOUNDRY_ALIAS, not FOUNDRY_MODEL. ai_review_sdk.py reads
  # FOUNDRY_ALIAS and ignores FOUNDRY_MODEL by design, because the catalog wants
  # a bare alias and rejects the versioned id that ai_review.py needs. Naming it
  # FOUNDRY_MODEL here silently fell through to the script's phi-4-mini default,
  # which is a 3.8B model on 2 CPU cores: exactly the timeout that consequence 2
  # warns about, while the log claimed qwen2.5-0.5b.
  FOUNDRY_ALIAS: qwen2.5-0.5b

  # What blocks a merge. Findings are always posted; only findings at or ABOVE
  # this severity fail the build. Order: blocker > major > minor > info.
  #   blocker  default. Secrets, disabled TLS, PII in logs. Style nits do not
  #            block, which is why people leave the reviewer switched on.
  #   major    also blocks missing error handling, SNAPSHOT deps.
  #   minor    strictest available.
  #   never    review and report, never fail. Right for a trial rollout.
  # Override per run from Pipelines > Run pipeline > Variables, no YAML edit.
  FAIL_ON: 'blocker'

  # Where foundry-local-core keeps downloaded models, so we can cache it.
  FOUNDRY_CACHE: $(Pipeline.Workspace)/.foundry-cache
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache

jobs:
  - job: ai_review_hosted
    displayName: AI peer review (hosted agent, local inference)

    # Explicit, and inside the free-tier private-repo ceiling. Setting this
    # higher than the hosted maximum has no effect: the platform cap wins.
    timeoutInMinutes: 55

    steps:
      - checkout: self
        # Need history for the three-dot diff against the target branch.
        fetchDepth: 0
        persistCredentials: true

      - task: UsePythonVersion@0
        displayName: Python 3.11
        inputs:
          versionSpec: '3.11'

      - script: |
          echo "--- agent shape ---"
          nproc
          free -h
          df -h /
        displayName: Show agent limits
        # Worth keeping in the demo. When you run this live, the room sees
        # 2 cores and ~10 GB free, and understands immediately why the model
        # choice matters.

      # Cache the pip wheels. foundry-local-core plus ONNX Runtime is a chunky
      # download and it does not change between runs.
      - task: Cache@2
        displayName: Cache pip
        inputs:
          key: 'pip | "$(Agent.OS)" | hosted-requirements.txt'
          path: $(PIP_CACHE_DIR)

      # Cache the model weights. This is the one that matters. Without it the
      # model downloads on every single run and you lose minutes you do not
      # have.
      - task: Cache@2
        displayName: Cache Foundry Local model
        inputs:
          key: 'foundry | "$(Agent.OS)" | "$(FOUNDRY_ALIAS)"'
          path: $(FOUNDRY_CACHE)

      - script: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --cache-dir "$PIP_CACHE_DIR" -r hosted-requirements.txt
          python -c "import foundry_local_sdk; print('sdk ready')"
        displayName: Install Foundry Local SDK

      - script: |
          set -euo pipefail
          df -h / | tail -1

          # In a PR build the target arrives as refs/heads/main. Strip the
          # prefix. The `:-` guards matter here because this step runs under
          # `set -u`: on a manually queued run there is no PR context, and a
          # bare $SYSTEM_PULLREQUEST_TARGETBRANCH aborts the step with
          # "unbound variable" before the review ever starts.
          TARGET="${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
          TARGET="${TARGET#refs/heads/}"
          TARGET="${TARGET:-main}"
          echo "target branch: $TARGET"

          # fetchDepth 0 already pulled full history, so only fetch if the ref
          # is genuinely missing.
          if ! git rev-parse --verify --quiet "origin/$TARGET" >/dev/null; then
            echo "origin/$TARGET not present, fetching"
            git fetch origin "$TARGET"
          fi
          git rev-parse --verify "origin/$TARGET" >/dev/null

          # Manual runs have no pull request to comment on. Rather than
          # crashing in post_thread on a missing SYSTEM_PULLREQUEST_PULLREQUESTID,
          # print findings into this log instead. Queue the pipeline against any
          # branch and you get a full smoke test without opening a PR.
          EXTRA=""
          if [ -z "${SYSTEM_PULLREQUEST_PULLREQUESTID:-}" ]; then
            echo "no pull request context: findings will print here instead of posting"
            EXTRA="--dry-run"
          fi

          python3 scripts/ai_review_sdk.py \
            --fail-on "${FAIL_ON:-blocker}" \
            --diff-base "origin/$TARGET" \
            $EXTRA
        displayName: Review the diff with a local model
        env:
          FAIL_ON: $(FAIL_ON)
          # Mapped explicitly. Azure DevOps does not expose this to scripts
          # otherwise, and the PR comments will fail with a 203 without it.
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          FOUNDRY_ALIAS: $(FOUNDRY_ALIAS)
          # Point the SDK's model cache at the cached directory.
          FOUNDRY_LOCAL_CACHE_DIR: $(FOUNDRY_CACHE)

      # No `condition: always()`. If the review step fails the job fails, the
      # build validation policy fails, and the merge is blocked. A review that
      # did not happen is not a pass.
